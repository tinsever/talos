name: Bug report
description: Report incorrect SDK behavior.
body:
  - type: input
    id: version
    attributes:
      label: Talos version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: Bun 1.4.2, Node 24, or browser version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal example with credentials removed.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant errors or logs with credentials removed.
    validations:
      required: true
