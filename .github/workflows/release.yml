name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (e.g. v0.1.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tinsever/talos'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Validate release version
        env:
          TALOS_RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: bun run check:release --tag "$TALOS_RELEASE_TAG"
      - run: bun run test:coverage
      - run: bun run smoke:node
      - name: Run protocol fault tests
        run: TALOS_SOAK_MS=10000 bun run soak
      - run: bunx playwright install --with-deps chromium firefox webkit
      - name: Install virtual audio backend
        run: sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils gstreamer1.0-plugins-good
      - name: Run browser tests with virtual audio
        run: bash scripts/test-browser-audio.sh
      - run: bun pm pack --ignore-scripts --filename package.tgz
      - run: bun run check:package package.tgz
      - run: bun run check:package:node package.tgz
      - name: Check whether the version is already published
        id: npm-version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`, {
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok && response.status !== 404)
            throw new Error(`npm registry check failed: ${response.status}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          if (response.ok) console.log(`${name}@${version} is already published; skipping npm publish`);
          NODE
      - name: Publish to npm
        if: steps.npm-version.outputs.published != 'true'
        env:
          # Optional bootstrap token; subsequent releases can use npm trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_PROVENANCE: true
          TALOS_DIST_TAG: ${{ (github.event.release.prerelease || contains(inputs.tag || github.event.release.tag_name, '-')) && 'next' || 'latest' }}
        run: |
          # An empty setup-node auth entry prevents npm's OIDC exchange.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            npm config delete '//registry.npmjs.org/:_authToken' --location=user
            unset NODE_AUTH_TOKEN
          fi
          npm publish ./package.tgz --ignore-scripts --access public --tag "$TALOS_DIST_TAG"
