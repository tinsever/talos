codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 0%
        if_not_found: failure
        flags:
          - unit
    patch:
      default:
        target: 85%
        threshold: 0%
        if_not_found: failure
        only_pulls: true

flags:
  unit:
    paths:
      - src/
    carryforward: false

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: true
